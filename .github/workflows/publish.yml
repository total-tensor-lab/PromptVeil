name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run pytest -p pytest_cov --cov=promptveil --cov-branch --cov-report=term-missing --cov-fail-under=90
      - id: version
        run: |
          package_version=$(uv run python -c "import promptveil; print(promptveil.__version__)")
          test "v${package_version}" = "$GITHUB_REF_NAME"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke-test:
    name: Smoke test TestPyPI release
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: uv venv "$RUNNER_TEMP/promptveil-testpypi"
      - run: uv pip install --python "$RUNNER_TEMP/promptveil-testpypi/bin/python" --index-strategy unsafe-best-match --index-url https://test.pypi.org/simple --extra-index-url https://pypi.org/simple "promptveil==${{ needs.build.outputs.version }}"
      - run: '"$RUNNER_TEMP/promptveil-testpypi/bin/python" -c "import promptveil; print(promptveil.__version__)"'

  pypi:
    name: Publish to PyPI
    needs: [build, testpypi-smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "PromptVeil v${{ needs.build.outputs.version }}"
          files: dist/*
          generate_release_notes: true
