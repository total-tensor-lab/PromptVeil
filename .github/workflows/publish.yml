name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run pytest -p pytest_cov --cov=promptveil --cov-branch --cov-report=term-missing --cov-fail-under=90
      - id: version
        run: |
          package_version=$(uv run python -c "import promptveil; print(promptveil.__version__)")
          test "v${package_version}" = "$GITHUB_REF_NAME"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke-test:
    name: Smoke test TestPyPI release
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv venv "$RUNNER_TEMP/promptveil-testpypi"
      - run: uv pip install --python "$RUNNER_TEMP/promptveil-testpypi/bin/python" --index-url https://test.pypi.org/simple --extra-index-url https://pypi.org/simple "promptveil==${{ needs.build.outputs.version }}"
      - run: '"$RUNNER_TEMP/promptveil-testpypi/bin/python" -c "import promptveil; print(promptveil.__version__)"'

  pypi:
    name: Publish to PyPI
    needs: [build, testpypi-smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
