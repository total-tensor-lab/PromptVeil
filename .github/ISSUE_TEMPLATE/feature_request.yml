name: Feature request
description: Suggest an integration, compliance profile, policy option or other improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Want a new type of PII, ID or secret detected? Use **Missing detector / false negative** instead.
        Early-stage ideas are also welcome in
        [Ideas Discussions](https://github.com/total-tensor-lab/PromptVeil/discussions/categories/ideas),
        where others can vote on them.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that PromptVeil does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: regulation
    attributes:
      label: Related regulation
      multiple: true
      options:
        - HIPAA
        - GDPR / UK GDPR
        - EU AI Act
        - India DPDPA
        - Other / none
  - type: markdown
    attributes:
      value: Please use synthetic examples only. Do not paste real personal data.
