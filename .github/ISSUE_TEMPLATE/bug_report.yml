name: Bug report
description: Report incorrect behavior, such as a missed detection or a false positive.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include real personal data, credentials, or
        secrets.** Use synthetic examples. For security vulnerabilities, use the
        private reporting link instead of this form.
  - type: input
    id: version
    attributes:
      label: PromptVeil version
      placeholder: "0.1.3"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Synthetic input, the policy used, and the code that triggers the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
